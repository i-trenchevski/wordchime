<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wordchime</title>
  <style>
    :root { color-scheme: light dark; --ground: #f6f6f4; --tile: #ffffff; --line: #e4e4e0; --ink: #1d1d1f; --muted: #6b6b6b; --accent: #d9480f; }
    @media (prefers-color-scheme: dark) { :root { --ground: #121212; --tile: #1e1e1e; --line: #2e2e2e; --ink: #f2f2f2; --muted: #a8a8a8; --accent: #ff8a3d; } }
    body { margin: 0; background: var(--ground); color: var(--ink); font: 17px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 32px 16px 48px; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: 40px; line-height: 1.15; margin: 0 0 8px; }
    section { background: var(--tile); border: 1px solid var(--line); border-radius: 18px; padding: 8px 24px 16px; }
    a { color: var(--accent); }
  </style>
</head>
<body>
<main>
  <h1>Wordchime</h1>
  <section>
    <p>A new Dutch word every hour on your Android phone: pronunciation, meaning, and example sentences in the present, past and future.</p>
    <p><a href="privacy.html">Privacy policy</a> · <a href="mailto:info.word.chime@gmail.com">info.word.chime@gmail.com</a></p>
  </section>
</main>
</body>
</html>
